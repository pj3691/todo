<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 GitStatus 桌宠</title>
    <link rel="stylesheet" href="/pages/assets/styles/theme.css">
    <link rel="stylesheet" href="/pages/assets/styles/components.css">
    <style>
        html {
            height: 100%;
        }

        body {
            min-height: 100%;
            margin: 0;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 12% 8%, rgba(39, 129, 81, 0.16), transparent 24rem),
                radial-gradient(circle at 88% 92%, rgba(39, 129, 81, 0.1), transparent 22rem),
                var(--bg, #f3f7f2);
        }

        .login-card {
            width: min(360px, calc(100vw - 40px));
            padding: 28px;
            border: 1px solid var(--line, #e1e9e2);
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 24px 60px rgba(20, 58, 36, 0.12);
        }

        .login-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted, #708276);
            font-size: 10px;
            font-weight: 720;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .login-brand-mark {
            display: grid;
            width: 30px;
            height: 30px;
            place-items: center;
            border-radius: 9px;
            color: #fff;
            background: linear-gradient(145deg, #1b6c45, #2d8f5e);
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0;
        }

        h1 {
            margin: 20px 0 7px;
            color: var(--text, #17231a);
            font-size: 24px;
            letter-spacing: -0.04em;
        }

        .login-copy {
            margin: 0 0 22px;
            color: var(--muted, #708276);
            font-size: 12px;
            line-height: 1.7;
        }

        .login-error {
            margin: 0 0 14px;
            padding: 9px 11px;
            border-radius: 9px;
            color: #a33b31;
            background: #fbecea;
            font-size: 12px;
            line-height: 1.6;
        }

        .login-submit {
            width: 100%;
            margin-top: 4px;
        }

        .login-hint {
            margin: 16px 0 0;
            color: #96a59a;
            font-size: 10px;
            line-height: 1.6;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="login-brand">
            <span class="login-brand-mark">G</span>
            <span>GitStatus Desktop Pet</span>
        </div>
        <h1>登录桌面桌宠</h1>
        <p class="login-copy">登录后桌宠才能读取你的待办提醒喵。账号与网页端共用。</p>
        <form id="loginForm" autocomplete="on">
            <div class="field">
                <label for="username">账号</label>
                <input class="text-input" id="username" name="username" type="text"
                    autocomplete="username" maxlength="64" required>
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input class="text-input" id="password" name="password" type="password"
                    autocomplete="current-password" maxlength="128" required>
            </div>
            <p class="login-error hidden" id="loginError" role="alert"></p>
            <button class="btn btn-primary login-submit" id="loginSubmit" type="submit">登录</button>
        </form>
        <p class="login-hint">登录状态保存在桌面桌宠内，关闭后再打开仍然有效。</p>
    </main>
    <script src="/pages/assets/js/auth-client.js"></script>
    <script src="/pages/assets/js/desktop-login.js"></script>
</body>
</html>
