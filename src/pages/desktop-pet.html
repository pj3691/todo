<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitStatus 桌宠</title>
    <link rel="stylesheet" href="/pages/assets/styles/theme.css">
    <link rel="stylesheet" href="/pages/assets/styles/components.css">
    <link rel="stylesheet" href="/pages/assets/styles/pet-widget.css?v=20261026m">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent !important;
        }

        body {
            -webkit-user-select: none;
            user-select: none;
        }

        body.pet-hidden .pet-widget {
            display: none !important;
        }
    </style>
</head>
<body>
    <script>
        // 桌面版配置：覆盖层覆盖虚拟桌面，初始位置放在当前显示器右下角
        const initialDisplay = window.desktopInitialDisplay;
        const initialPosition = initialDisplay
            ? {
                  left: initialDisplay.display.x - initialDisplay.virtual.x,
                  top: initialDisplay.display.y - initialDisplay.virtual.y,
                  width: initialDisplay.display.width,
                  height: initialDisplay.display.height
              }
            : null;
        window.GITSTATUS_PET_CONFIG = {
            desktop: true,
            desktopStage: true,
            initialPosition,
            onLogin: () => window.desktopApi?.openLogin()
        };
    </script>
    <script src="/pages/assets/js/pet-widget.js?v=20261026m"></script>
    <script>
        (function () {
            window.desktopApi?.onStageAnchor?.((anchor) => {
                window.GitStatusPet?.setStageAnchor?.(anchor);
            });

            // 透明区域点击穿透：只有桌宠和气泡区域接收鼠标
            let interactive = false;
            function setInteractive(value) {
                if (value === interactive) return;
                interactive = value;
                window.desktopApi?.setInteractive(value);
            }

            document.addEventListener("mousemove", (event) => {
                const target = document.elementFromPoint(event.clientX, event.clientY);
                // 拖动桌宠时强制保持可交互，避免拖到屏幕边缘后命中测试把覆盖层切成穿透
                const dragging = Boolean(document.querySelector(".pet-widget.is-dragging"));
                setInteractive(dragging || Boolean(target && target.closest(".pet-widget")));
            });

            document.addEventListener("mouseout", (event) => {
                if (!event.relatedTarget) setInteractive(false);
            });

            // Windows 原生窗口区域：只让桌宠和气泡所在矩形参与命中测试，
            // 其余透明区域不接收鼠标，直接落到待办/登录等窗口。
            const hitSelectors = [
                ".pet-widget",
                ".pet-avatar",
                ".pet-bubble",
                ".pet-mini",
                ".pet-menu-btn",
                ".pet-add-btn",
                ".pet-todo-btn"
            ];
            let hitFrame = 0;
            let lastHitSignature = "";

            function collectHitRegions() {
                const regions = [];
                for (const selector of hitSelectors) {
                    for (const element of document.querySelectorAll(selector)) {
                        const style = getComputedStyle(element);
                        const rect = element.getBoundingClientRect();
                        if (
                            rect.width <= 0 ||
                            rect.height <= 0 ||
                            style.display === "none" ||
                            style.visibility === "hidden" ||
                            Number(style.opacity) <= 0.01
                        ) {
                            continue;
                        }
                        const padding = 12;
                        const left = Math.max(0, Math.floor(rect.left - padding));
                        const top = Math.max(0, Math.floor(rect.top - padding));
                        const right = Math.min(window.innerWidth, Math.ceil(rect.right + padding));
                        const bottom = Math.min(window.innerHeight, Math.ceil(rect.bottom + padding));
                        if (right <= left || bottom <= top) continue;
                        regions.push({ x: left, y: top, width: right - left, height: bottom - top });
                    }
                }
                return regions;
            }

            function reportHitRegions() {
                hitFrame = 0;
                if (!window.desktopApi?.setHitRegions) return;
                // 拖拽期间由主进程负责窗口移动，避免每帧重复计算命中矩形。
                if (document.querySelector(".pet-widget.is-dragging")) return;
                const regions = collectHitRegions();
                const signature = JSON.stringify(regions);
                if (signature === lastHitSignature) return;
                lastHitSignature = signature;
                window.desktopApi.setHitRegions(regions);
            }

            function scheduleHitRegions() {
                if (hitFrame) return;
                hitFrame = window.requestAnimationFrame(reportHitRegions);
            }

            window.setTimeout(scheduleHitRegions, 0);
            window.setInterval(reportHitRegions, 150);
            window.addEventListener("resize", scheduleHitRegions);
            document.addEventListener("pointermove", scheduleHitRegions, { passive: true });
            document.addEventListener("pointerup", scheduleHitRegions, { passive: true });
            new MutationObserver(scheduleHitRegions).observe(document.body, {
                subtree: true,
                childList: true,
                attributes: true,
                attributeFilter: ["class", "style", "aria-hidden"]
            });

            // 气泡里的链接统一交给系统浏览器打开，避免把桌宠窗口导航走
            document.addEventListener(
                "click",
                (event) => {
                    const target = event.target instanceof Element ? event.target : null;
                    const link = target ? target.closest("a[href]") : null;
                    if (!link) return;
                    event.preventDefault();
                    if (link.hasAttribute("data-pet-add") && window.desktopApi?.openTodoAdd) {
                        window.desktopApi.openTodoAdd();
                        return;
                    }
                    try {
                        const url = new URL(link.href, location.href);
                        if (url.pathname.endsWith("/pages/todo.html") && window.desktopApi?.openTodo) {
                            window.desktopApi.openTodo();
                            return;
                        }
                    } catch {
                        /* 非法链接继续走外部打开 */
                    }
                    window.desktopApi?.openExternal(link.href);
                },
                true
            );

            // 主进程隐藏 / 显示桌宠时，用小气泡播报
            let hideNoticeTimer = 0;
            let hideRequested = false;
            window.desktopApi?.onPetEvent?.((type) => {
                if (type === "before-hide") {
                    hideRequested = true;
                    window.GitStatusPet?.showMiniNotice?.("goodbye");
                    // 给再见气泡留出展示时间，再真正隐藏覆盖层；页面侧也兜底清掉桌宠
                    window.clearTimeout(hideNoticeTimer);
                    hideNoticeTimer = window.setTimeout(() => {
                        if (!hideRequested) return;
                        document.body.classList.add("pet-hidden");
                        window.desktopApi?.hideNow?.();
                    }, 1100);
                } else if (type === "hidden") {
                    hideRequested = false;
                    window.clearTimeout(hideNoticeTimer);
                    hideNoticeTimer = 0;
                    document.body.classList.add("pet-hidden");
                } else if (type === "after-show") {
                    hideRequested = false;
                    window.clearTimeout(hideNoticeTimer);
                    hideNoticeTimer = 0;
                    document.body.classList.remove("pet-hidden");
                    window.GitStatusPet?.showMiniNotice?.("welcome");
                } else if (type === "display-changed") {
                    // 舞台窗口由主进程直接移动到目标显示器，页面内位置不变。
                }
            });

            // 首次启动未登录时直接弹出登录气泡，省得找不到菜单按钮
            window.addEventListener("load", () => {
                window.setTimeout(() => {
                    let hasToken = false;
                    try {
                        hasToken = Boolean(localStorage.getItem("gitstatus_todo_token"));
                    } catch {
                        /* localStorage 不可用时按未登录处理 */
                    }
                    if (!hasToken) window.GitStatusPet?.showSummary();
                }, 400);
            });
        })();
    </script>
</body>
</html>
