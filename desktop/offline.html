<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitStatus 桌宠</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: transparent;
        }

        body {
            display: grid;
            place-items: center;
            -webkit-user-select: none;
            user-select: none;
        }

        .card {
            width: min(360px, calc(100vw - 32px));
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 18px;
            background: #fbfdfb;
            box-shadow: 0 24px 60px rgba(4, 18, 10, 0.34);
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            height: 22px;
            padding: 0 9px;
            border-radius: 999px;
            color: #1f6b45;
            background: #e8f4ec;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        h1 {
            margin: 14px 0 8px;
            color: #173d29;
            font-size: 19px;
            letter-spacing: -0.02em;
        }

        p {
            margin: 0;
            color: #5d7264;
            font-size: 12px;
            line-height: 1.7;
        }

        code {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 9px;
            color: #1d4f35;
            background: #eef5f0;
            font-family: Consolas, "Cascadia Code", monospace;
            font-size: 12px;
        }

        .server {
            margin-top: 10px;
            color: #8a9b90;
            font-size: 11px;
            word-break: break-all;
        }

        button {
            width: 100%;
            height: 38px;
            margin-top: 16px;
            border: 0;
            border-radius: 10px;
            color: #fff;
            background: #1f7a4d;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1a6a43;
        }

        button:disabled {
            cursor: default;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">GITSTATUS PET</span>
        <h1>后台还没有启动喵</h1>
        <p>请先在项目根目录启动后端，再点下面的按钮重新连接。</p>
        <code>npx tsx src/index.ts</code>
        <p class="server" id="server"></p>
        <button id="retry" type="button">重新连接</button>
    </div>
    <script>
        const server = new URLSearchParams(location.search).get("server") || "";
        const serverNode = document.getElementById("server");
        if (server) serverNode.textContent = server;

        let interactive = false;
        function setInteractive(value) {
            if (value === interactive) return;
            interactive = value;
            window.desktopApi?.setInteractive(value);
        }

        // 大窗口透明区域保持点击穿透，只有卡片区域接收鼠标
        document.addEventListener("mousemove", (event) => {
            const target = document.elementFromPoint(event.clientX, event.clientY);
            setInteractive(Boolean(target && target.closest(".card")));
        });

        document.addEventListener("mouseout", (event) => {
            if (!event.relatedTarget) setInteractive(false);
        });

        document.getElementById("retry").addEventListener("click", () => {
            const button = document.getElementById("retry");
            button.disabled = true;
            button.textContent = "连接中…";
            window.desktopApi?.retry();
            window.setTimeout(() => {
                button.disabled = false;
                button.textContent = "重新连接";
            }, 3000);
        });
    </script>
</body>
</html>
